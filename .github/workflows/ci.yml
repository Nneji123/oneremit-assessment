name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # TODO: remove the guard once the backend test suite exists.
      - name: Run backend tests when implemented
        run: |
          if [ -d tests ]; then
            uv run pytest
          else
            echo "Backend tests are not implemented yet; leaving this gate explicit."
          fi

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # TODO: remove the guard once the frontend test suite exists.
      - name: Run frontend tests when implemented
        run: |
          if find . -path './node_modules' -prune -o -name '*.test.*' -print -quit | grep -q .; then
            npm test -- --run
          else
            echo "Frontend tests are not implemented yet; leaving this gate explicit."
          fi
