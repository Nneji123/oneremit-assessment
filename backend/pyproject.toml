[project]
name = "oneremit-assessment-backend"
version = "0.1.0"
description = "Django REST foundation for the Oneremit payout assessment"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6.0",
    "dj-database-url>=2.3,<3.0",
    "django-cors-headers>=4.7,<5.0",
    "djangorestframework>=3.16,<4.0",
    "drf-spectacular>=0.28,<1.0",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "ruff>=0.11,<1.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
